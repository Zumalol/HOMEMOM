<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ออกบิลค่าปรับ - ระบบหอพัก</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background: #f0f4f8; min-height: 100vh; }
        .card { border: none; border-radius: 1.25rem; box-shadow: 0 8px 24px rgba(149, 157, 165, 0.15); }
        .card-header { background: linear-gradient(135deg, #fd7e14 0%, #d9650b 100%); color: white; border-top-left-radius: 1.25rem !important; border-top-right-radius: 1.25rem !important; padding: 1.5rem 1rem; }
        .form-control, .form-select { border-radius: 0.65rem; padding: 0.75rem 1rem; border: 1px solid #dce2e6; }
        .section-title { font-weight: 600; color: #334155; font-size: 1.05rem; border-left: 4px solid #fd7e14; padding-left: 10px; margin-top: 1.5rem; margin-bottom: 1rem; }
        .btn-submit { padding: 0.9rem; font-weight: 600; font-size: 1.05rem; border-radius: 0.65rem; background: linear-gradient(135deg, #fd7e14 0%, #d9650b 100%); border: none; color: white; }
        .info-box { background-color: #fffbe6; border: 1px solid #ffe58f; border-radius: 0.75rem; padding: 15px; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container py-3 py-md-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10 px-2 px-sm-3">
                <div class="card">
                    <div class="card-header text-center">
                        <h3 class="mb-1 fw-bold fs-4 fs-md-3"><i class="fa-solid fa-triangle-exclamation me-2"></i>ออกบิลแจ้งค่าปรับล่าช้า</h3>
                        <p class="mb-0 text-white-50 small">เลือกบ้านเลขที่ค้างชำระ เพื่อคำนวณและสร้างข้อความแจ้งค่าปรับ</p>
                    </div>
                    <div class="card-body p-3 p-md-5">
                        <form id="fineBillingForm">
                            <div class="section-title">ข้อมูลผู้เช่าและกำหนดชำระเดิม</div>
                            <div class="row g-3 mb-3">
                                <div class="col-12">
                                    <label class="form-label fw-medium">บ้านเลขที่ <span class="text-danger">*</span></label>
                                    <select class="form-select" id="houseNoSelect" required>
                                        <option value="">-- กำลังโหลดรายชื่อผู้เช่า --</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6 col-12">
                                    <label class="form-label fw-medium">ชื่อผู้เช่า</label>
                                    <input type="text" class="form-control bg-light" id="tenantName" readonly placeholder="อัตโนมัติ">
                                </div>
                                <div class="col-md-6 col-12">
                                    <label class="form-label fw-medium">วันครบกำหนดชำระเดิม</label>
                                    <input type="text" class="form-control bg-light" id="dueDateDisplay" readonly placeholder="อัตโนมัติ">
                                </div>
                            </div>

                            <div class="section-title">⏰ การคำนวณค่าปรับ</div>
                            <div class="info-box">
                                <div class="row g-3">
                                    <div class="col-md-6 col-12">
                                        <label class="form-label fw-medium">จำนวนวันที่เกินกำหนด</label>
                                        <input type="text" class="form-control bg-white fw-bold text-danger fs-5" id="overdueDays" readonly value="0 วัน">
                                    </div>
                                    <div class="col-md-6 col-12">
                                        <label class="form-label fw-medium">อัตราค่าปรับต่อวัน (บาท)</label>
                                        <input type="number" class="form-control bg-white" id="fineRate" placeholder="เช่น 100">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label fw-medium">ยอดค่าปรับรวมทั้งสิ้น (บาท)</label>
                                        <input type="text" class="form-control bg-white fw-bold text-success fs-4" id="totalFineAmount" readonly value="0 บาท">
                                    </div>
                                </div>
                            </div>

                            <div class="section-title">📝 หมายเหตุเพิ่มเติม (ถ้ามี)</div>
                            <div class="mb-4">
                                <textarea class="form-control" id="additionalNote" rows="2" placeholder="เช่น รบกวนชำระด่วนภายในวันนี้"></textarea>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-submit shadow-sm">
                                    🚀 สรุปยอดค่าปรับและคัดลอกข้อความ
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        fetch('navbar.html').then(res => res.text()).then(html => { document.getElementById('navbar-placeholder').innerHTML = html; });

        let tenantsData = [];
        let calculatedDays = 0;

        async function loadTenantsDropdown() {
            try {
                const res = await fetch('/api/tenants');
                const result = await res.json();
                const select = document.getElementById('houseNoSelect');
                if (result.success && result.tenants.length > 0) {
                    tenantsData = result.tenants.filter(t => t.status !== 'ชำระแล้ว' && t.due_date);
                    if (tenantsData.length > 0) {
                        select.innerHTML = '<option value="">-- กรุณาเลือกบ้านเลขที่ค้างชำระ --</option>' + 
                            tenantsData.map(t => `<option value="${t.house_no}">${t.house_no} - ${t.tenant_name}</option>`).join('');
                    } else {
                        select.innerHTML = '<option value="">ไม่มีบ้านที่ค้างชำระหรือเกินกำหนด</option>';
                    }
                } else {
                    select.innerHTML = '<option value="">ยังไม่มีข้อมูลผู้เช่าในระบบ</option>';
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('houseNoSelect').addEventListener('change', function() {
            const selectedHouse = this.value;
            const tenant = tenantsData.find(t => t.house_no === selectedHouse);
            if (tenant) {
                document.getElementById('tenantName').value = tenant.tenant_name;
                document.getElementById('dueDateDisplay').value = new Date(tenant.due_date).toLocaleDateString('th-TH');
                document.getElementById('fineRate').value = tenant.fine_rate || 100;

                const today = new Date();
                today.setHours(0,0,0,0);
                const dueDate = new Date(tenant.due_date);
                dueDate.setHours(0,0,0,0);
                
                const diffTime = today - dueDate;
                calculatedDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (calculatedDays < 0) calculatedDays = 0;

                document.getElementById('overdueDays').value = `${calculatedDays} วัน`;
                calculateTotalFine();
            } else {
                document.getElementById('tenantName').value = '';
                document.getElementById('dueDateDisplay').value = '';
                document.getElementById('overdueDays').value = '0 วัน';
                document.getElementById('totalFineAmount').value = '0 บาท';
                calculatedDays = 0;
            }
        });

        document.getElementById('fineRate').addEventListener('input', calculateTotalFine);

        function calculateTotalFine() {
            const rate = parseFloat(document.getElementById('fineRate').value) || 0;
            const total = calculatedDays * rate;
            document.getElementById('totalFineAmount').value = `${total.toLocaleString()} บาท`;
        }

        document.getElementById('fineBillingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const houseNo = document.getElementById('houseNoSelect').value;
            const tenantName = document.getElementById('tenantName').value;
            const dueDate = document.getElementById('dueDateDisplay').value;
            const rate = parseFloat(document.getElementById('fineRate').value) || 0;
            const totalFine = calculatedDays * rate;
            const note = document.getElementById('additionalNote').value;

            if (!houseNo) {
                Swal.fire('แจ้งเตือน', 'กรุณาเลือกบ้านเลขที่', 'warning');
                return;
            }

            Swal.fire({ title: 'กำลังประมวลผล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            try {
                const response = await fetch('/api/generate-fine-bill', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ houseNo, tenantName, dueDate, overdueDays: calculatedDays, fineRate: rate, totalFine, note })
                });
                const result = await response.json();
                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'สร้างข้อความค่าปรับสำเร็จ!',
                        html: `
                            <p class="text-muted small mb-2">คัดลอกข้อความด้านล่างนี้ไปส่งทางแชทได้เลยครับ 👇</p>
                            <textarea id="copyTextarea" class="form-control mb-3" rows="8" readonly style="font-size: 13px;">${result.messageText}</textarea>
                            <div class="d-grid"><button id="copyBtn" class="btn btn-primary btn-lg fs-6"><i class="fa-solid fa-copy me-1"></i> คัดลอกข้อความ</button></div>
                        `,
                        showConfirmButton: false, showCloseButton: true
                    });
                    document.getElementById('copyBtn').addEventListener('click', () => {
                        const ta = document.getElementById('copyTextarea');
                        ta.select();
                        navigator.clipboard.writeText(ta.value);
                        Swal.fire({ icon: 'success', title: 'คัดลอกเรียบร้อย!', timer: 1500, showConfirmButton: false });
                    });
                } else {
                    Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: result.message });
                }
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ' });
            }
        });

        loadTenantsDropdown();
    </script>
</body>
</html>
