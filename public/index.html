<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ออกบิลค่าใช้จ่าย - ระบบหอพัก</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; }
        .card { border: none; border-radius: 1rem; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
        .card-header { background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); color: white; border-top-left-radius: 1rem !important; border-top-right-radius: 1rem !important; padding: 1.25rem; }
        .form-control, .form-select { border-radius: 0.5rem; padding: 0.75rem 1rem; border: 1px solid #ced4da; }
        .section-title { font-weight: 600; color: #495057; font-size: 1.1rem; border-left: 4px solid #0d6efd; padding-left: 10px; margin-top: 1.5rem; margin-bottom: 1rem; }
        .btn-submit { padding: 0.85rem; font-weight: 600; font-size: 1.1rem; border-radius: 0.5rem; background: linear-gradient(135deg, #198754 0%, #157347 100%); border: none; }
        .other-fee-row { background-color: #f8f9fa; padding: 12px; border-radius: 0.5rem; border: 1px dashed #ced4da; margin-bottom: 10px; }
        .fine-section { background-color: #fff3cd; border: 1px solid #ffeeba; border-radius: 0.5rem; padding: 15px; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card">
                    <div class="card-header text-center">
                        <h3 class="mb-1 fw-bold"><i class="fa-solid fa-calculator me-2"></i>สรุปบิลค่าใช้จ่ายประจำเดือน</h3>
                        <p class="mb-0 text-white-50">เลือกบ้านเลขที่จากระบบ และคำนวณบิลส่งผู้เช่า</p>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form id="billingForm">
                            <div class="section-title">ข้อมูลบ้านเลขที่และผู้เช่า</div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-12">
                                    <label class="form-label fw-medium">บ้านเลขที่ <span class="text-danger">*</span></label>
                                    <select class="form-select" id="houseNoSelect" required>
                                        <option value="">-- กำลังโหลดรายชื่อผู้เช่า --</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-medium">ชื่อผู้เช่า</label>
                                    <input type="text" class="form-control bg-light" id="tenantName" readonly placeholder="เลือกบ้านเลขเพื่อแสดงชื่อ">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-medium">ค่าเช่าบ้าน / ค่าห้อง (บาท)</label>
                                    <input type="number" class="form-control" id="roomRent" placeholder="เช่น 3500" required>
                                </div>
                            </div>

                            <div class="section-title">⚡️ ข้อมูลค่าไฟฟ้า</div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-12">
                                    <label class="form-label fw-medium">ค่าไฟฟ้า (บาท) <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="elecAmount" placeholder="เช่น 850" required>
                                </div>
                            </div>

                            <div class="section-title">💧 ค่าน้ำประปา</div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-12">
                                    <label class="form-label fw-medium">ค่าน้ำประปา (บาท) <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="waterRent" placeholder="เช่น 50" required>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center section-title mb-2">
                                <span>📌 ค่าใช้จ่ายอื่นๆ (ถ้ามี / ไม่บังคับ)</span>
                                <button type="button" class="btn btn-outline-primary btn-sm" id="addFeeBtn">
                                    <i class="fa-solid fa-plus"></i> เพิ่มรายการ
                                </button>
                            </div>
                            <div id="otherFeesContainer" class="mb-4">
                                <div class="row g-2 align-items-center other-fee-row fee-item">
                                    <div class="col-md-7 col-6">
                                        <input type="text" class="form-control fee-name" placeholder="ชื่อรายการ เช่น ค่าส่วนกลาง">
                                    </div>
                                    <div class="col-md-4 col-5">
                                        <input type="number" class="form-control fee-amount" placeholder="จำนวนเงิน (บาท)">
                                    </div>
                                    <div class="col-md-1 col-1 text-center">
                                        <button type="button" class="btn btn-outline-danger btn-sm remove-fee-btn"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            </div>

                            <div class="section-title">⚠️ ค่าปรับหากเกินกำหนด (ไม่บังคับ)</div>
                            <div class="fine-section">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="enableFine" style="width: 20px; height: 20px; cursor: pointer;">
                                    <label class="form-check-label fw-bold ms-2 mt-1" for="enableFine" style="cursor: pointer;">
                                        เปิดใช้งานเงื่อนไขค่าปรับเกินกำหนด
                                    </label>
                                </div>
                                <div id="fineDetails" style="display: none;" class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-medium">กำหนดชำระภายในวันที่</label>
                                        <input type="date" class="form-control bg-white" id="dueDate">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-medium">อัตราค่าปรับ (เช่น 100 บาทต่อวัน)</label>
                                        <input type="text" class="form-control bg-white" id="fineText" placeholder="เช่น 100 บาทต่อวัน">
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-submit text-white" id="submitBtn">
                                    🚀 สรุปยอดและคัดลอกข้อความ
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        fetch('navbar.html').then(res => res.text()).then(html => { document.getElementById('navbar-placeholder').innerHTML = html; });

        let tenantsData = [];

        async function loadTenantsDropdown() {
            try {
                const res = await fetch('/api/tenants');
                const result = await res.json();
                const select = document.getElementById('houseNoSelect');
                if (result.success && result.tenants.length > 0) {
                    tenantsData = result.tenants;
                    select.innerHTML = '<option value="">-- กรุณาเลือกบ้านเลขที่ --</option>' + 
                        tenantsData.map(t => `<option value="${t.house_no}">${t.house_no} - ${t.tenant_name}</option>`).join('');
                } else {
                    select.innerHTML = '<option value="">ยังไม่มีข้อมูลผู้เช่าในระบบ</option>';
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('houseNoSelect').addEventListener('change', function() {
            const selectedHouse = this.value;
            const tenant = tenantsData.find(t => t.house_no === selectedHouse);
            if (tenant) {
                document.getElementById('tenantName').value = tenant.tenant_name;
                document.getElementById('roomRent').value = tenant.room_rent;
            } else {
                document.getElementById('tenantName').value = '';
                document.getElementById('roomRent').value = 3500;
            }
        });

        document.getElementById('enableFine').addEventListener('change', function() {
            const fineDetails = document.getElementById('fineDetails');
            fineDetails.style.display = this.checked ? 'flex' : 'none';
        });

        document.getElementById('addFeeBtn').addEventListener('click', () => {
            const container = document.getElementById('otherFeesContainer');
            const newRow = document.createElement('div');
            newRow.className = 'row g-2 align-items-center other-fee-row fee-item';
            newRow.innerHTML = `
                <div class="col-md-7 col-6"><input type="text" class="form-control fee-name" placeholder="ชื่อรายการ เช่น ค่าส่วนกลาง"></div>
                <div class="col-md-4 col-5"><input type="number" class="form-control fee-amount" placeholder="จำนวนเงิน (บาท)"></div>
                <div class="col-md-1 col-1 text-center"><button type="button" class="btn btn-outline-danger btn-sm remove-fee-btn"><i class="fa-solid fa-trash"></i></button></div>
            `;
            container.appendChild(newRow);
        });

        document.getElementById('otherFeesContainer').addEventListener('click', (e) => {
            if (e.target.closest('.remove-fee-btn')) {
                const item = e.target.closest('.fee-item');
                if (document.querySelectorAll('.fee-item').length > 1) item.remove();
                else { item.querySelector('.fee-name').value = ''; item.querySelector('.fee-amount').value = ''; }
            }
        });

        document.getElementById('billingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const feeItems = document.querySelectorAll('.fee-item');
            const otherFees = [];
            feeItems.forEach(item => {
                const name = item.querySelector('.fee-name').value.trim();
                const amount = parseFloat(item.querySelector('.fee-amount').value) || 0;
                if (name && amount > 0) otherFees.push({ name, amount });
            });

            const enableFine = document.getElementById('enableFine').checked;
            const rawDate = document.getElementById('dueDate').value; // YYYY-MM-DD

            const formData = {
                houseNo: document.getElementById('houseNoSelect').value,
                tenantName: document.getElementById('tenantName').value,
                roomRent: parseFloat(document.getElementById('roomRent').value),
                elecAmount: parseFloat(document.getElementById('elecAmount').value),
                waterRent: parseFloat(document.getElementById('waterRent').value),
                otherFees,
                fine: enableFine ? { dueDate: rawDate, fineText: document.getElementById('fineText').value } : null
            };

            Swal.fire({ title: 'กำลังประมวลผล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            try {
                const response = await fetch('/api/generate-bill', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const result = await response.json();
                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'สร้างข้อความสำเร็จ!',
                        html: `
                            <p class="text-muted small mb-2">คัดลอกข้อความด้านล่างนี้ไปส่งทางแชทได้เลยครับ 👇</p>
                            <textarea id="copyTextarea" class="form-control mb-3" rows="8" readonly style="font-size: 13px;">${result.messageText}</textarea>
                            <div class="d-grid"><button id="copyBtn" class="btn btn-primary"><i class="fa-solid fa-copy"></i> คัดลอกข้อความ</button></div>
                        `,
                        showConfirmButton: false, showCloseButton: true
                    });
                    document.getElementById('copyBtn').addEventListener('click', () => {
                        const ta = document.getElementById('copyTextarea');
                        ta.select();
                        navigator.clipboard.writeText(ta.value);
                        Swal.fire({ icon: 'success', title: 'คัดลอกเรียบร้อย!', timer: 1500, showConfirmButton: false });
                    });
                } else {
                    Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: result.message });
                }
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ' });
            }
        });

        loadTenantsDropdown();
    </script>
</body>
</html>
