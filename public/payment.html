<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ช่องทางชำระเงิน - ระบบหอพัก</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background: #f0f4f8; min-height: 100vh; }
        .card { border: none; border-radius: 1.25rem; box-shadow: 0 8px 24px rgba(149, 157, 165, 0.15); }
        .card-header { background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); color: white; border-top-left-radius: 1.25rem !important; border-top-right-radius: 1.25rem !important; padding: 1.25rem 1rem; }
        .payment-card { border: 2px solid #e2e8f0; border-radius: 1rem; transition: all 0.25s ease; background: #fff; position: relative; }
        .payment-card.active-main { border-color: #198754; background-color: #f0fdf4; box-shadow: 0 4px 12px rgba(25, 135, 84, 0.12); }
        .badge-active { position: absolute; top: 15px; right: 15px; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container py-3 py-md-5">
        <div class="row justify-content-center">
            <div class="col-lg-10 px-2 px-sm-3">
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4 class="mb-0 fw-bold fs-5 fs-md-4"><i class="fa-solid fa-wallet me-2"></i>จัดการช่องทางชำระเงิน</h4>
                        <button class="btn btn-light btn-sm fw-bold text-primary rounded-pill px-3 shadow-sm" onclick="openAddModal()">
                            <i class="fa-solid fa-plus me-1"></i>เพิ่มช่องทาง
                        </button>
                    </div>
                    <div class="card-body p-3 p-md-4">
                        <p class="text-muted small mb-4">คลิกปุ่ม <strong>"ตั้งเป็นช่องทางหลัก"</strong> เพื่อเลือกบัญชีที่จะนำไปต่อท้ายข้อความบิลแจ้งยอด</p>
                        <div class="row g-3 g-md-4" id="paymentListContainer">
                            <div class="col-12 text-center text-muted py-4">กำลังโหลดข้อมูล...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        fetch('navbar.html').then(res => res.text()).then(html => { document.getElementById('navbar-placeholder').innerHTML = html; });

        async function loadPaymentMethods() {
            try {
                const res = await fetch('/api/payment-methods');
                const result = await res.json();
                const container = document.getElementById('paymentListContainer');

                if (result.success && result.methods.length > 0) {
                    container.innerHTML = result.methods.map(m => {
                        const isMain = m.is_active;
                        const icon = m.type === 'bank' ? 'fa-building-columns text-success' : 'fa-qrcode text-primary';
                        const title = m.type === 'bank' ? `ธนาคาร: ${m.bank_name}` : 'พร้อมเพย์ (PromptPay)';

                        return `
                            <div class="col-md-6 col-12">
                                <div class="payment-card p-3 p-md-4 h-100 ${isMain ? 'active-main' : ''}">
                                    ${isMain ? '<span class="badge bg-success badge-active rounded-pill"><i class="fa-solid fa-check me-1"></i>ช่องทางหลัก</span>' : ''}
                                    <div class="d-flex align-items-center mb-3">
                                        <div class="fs-2 me-3"><i class="fa-solid ${icon}"></i></div>
                                        <div>
                                            <h5 class="fw-bold mb-0 fs-6 fs-md-5">${title}</h5>
                                            <small class="text-muted">${m.type === 'bank' ? 'บัญชีธนาคาร' : 'เบอร์ / พร้อมเพย์'}</small>
                                        </div>
                                    </div>
                                    <div class="mb-2 small"><strong>เลขที่บัญชี / หมายเลข:</strong> <span class="fs-6 fw-bold text-dark">${m.account_no}</span></div>
                                    <div class="mb-3 small"><strong>ชื่อบัญชี:</strong> ${m.account_name}</div>
                                    <div class="d-flex gap-2">
                                        ${!isMain ? `<button class="btn btn-outline-success btn-sm flex-grow-1 rounded-3" onclick="setActiveMethod(${m.id})"><i class="fa-solid fa-star me-1"></i>ตั้งเป็นช่องทางหลัก</button>` : ''}
                                        <button class="btn btn-outline-danger btn-sm rounded-3" onclick="deleteMethod(${m.id})"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = `<div class="col-12 text-center text-muted py-4">ยังไม่มีช่องทางชำระเงิน กรุณากดเพิ่มด้านบน</div>`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        function openAddModal() {
            Swal.fire({
                title: '<h4 class="fw-bold text-primary"><i class="fa-solid fa-plus me-2"></i>เพิ่มช่องทางชำระเงิน</h4>',
                html: `
                    <div class="text-start mb-2"><label class="form-label fw-bold small">ประเภทช่องทาง</label></div>
                    <select id="swal-type" class="form-select mb-3" onchange="toggleType(this.value)">
                        <option value="bank">บัญชีธนาคาร</option>
                        <option value="promptpay">พร้อมเพย์ (PromptPay)</option>
                    </select>
                    <div class="text-start mb-2" id="bankNameGroup">
                        <label class="form-label fw-bold small">ชื่อธนาคาร</label>
                        <input id="swal-bankname" class="form-control" placeholder="เช่น กสิกรไทย, ไทยพาณิชย์">
                    </div>
                    <div class="text-start mb-2">
                        <label class="form-label fw-bold small" id="labelAccNo">เลขที่บัญชี</label>
                        <input id="swal-accno" class="form-control" placeholder="เช่น 123-4-56789-0">
                    </div>
                    <div class="text-start mb-2">
                        <label class="form-label fw-bold small">ชื่อบัญชี</label>
                        <input id="swal-accname" class="form-control" placeholder="เช่น นาย สมชาย ดีใจ">
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึก',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#0d6efd',
                preConfirm: () => {
                    return {
                        type: document.getElementById('swal-type').value,
                        bankName: document.getElementById('swal-bankname').value,
                        accountNo: document.getElementById('swal-accno').value,
                        accountName: document.getElementById('swal-accname').value
                    }
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const data = result.value;
                    if (!data.accountNo || !data.accountName) {
                        Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบถ้วน', 'warning');
                        return;
                    }
                    await fetch('/api/payment-methods', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    Swal.fire({ icon: 'success', title: 'สำเร็จ', text: 'เพิ่มช่องทางชำระเงินเรียบร้อยแล้ว', timer: 1500, showConfirmButton: false });
                    loadPaymentMethods();
                }
            });
        }

        function toggleType(val) {
            const group = document.getElementById('bankNameGroup');
            const label = document.getElementById('labelAccNo');
            if (val === 'bank') {
                group.style.display = 'block';
                label.innerText = 'เลขที่บัญชี';
            } else {
                group.style.display = 'none';
                label.innerText = 'หมายเลขพร้อมเพย์ (เบอร์โทร/เลขบัตร)';
            }
        }

        async function setActiveMethod(id) {
            await fetch(`/api/payment-methods/active/${id}`, { method: 'PUT' });
            loadPaymentMethods();
        }

        async function deleteMethod(id) {
            Swal.fire({
                title: 'ยืนยันการลบ?',
                text: 'คุณต้องการลบช่องทางชำระเงินนี้ใช่หรือไม่',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                confirmButtonText: 'ลบ',
                cancelButtonText: 'ยกเลิก'
            }).then(async (r) => {
                if (r.isConfirmed) {
                    await fetch(`/api/payment-methods/${id}`, { method: 'DELETE' });
                    loadPaymentMethods();
                }
            });
        }

        loadPaymentMethods();
    </script>
</body>
</html>
